# -- Main Menu --
# The main menu is displayed in the header at the top of the page.
# Acceptable parameters are name, pageRef, page, url, title, weight.
# 
# The simplest menu configuration is to provide:
#   name = The name to be displayed for this menu link
#   pageRef = The identifier of the page or section to link to
#
# By default the menu is ordered alphabetically. This can be
# overridden by providing a weight value. The menu will then be
# ordered by weight from lowest to highest.

# Hauptmenüpunkt: Boot.dev
[[main]]
  name = "Boot.dev"
  identifier = "bootdev"
  url = "/bootdev/"             # Wieder als URL mit Slash am Ende
  weight = 1

[[main]]
  name = "Python Certification"
  identifier = "python_certification"
  url = "/python_certification/"             # Wieder als URL mit Slash am Ende
  weight = 2

[[main]]
  name = "AI"
  identifier = "ai"
  url = "/ai/"             # Wieder als URL mit Slash am Ende
  weight = 3

# Untermenüpunkt: PCAP
[[main]]
  name = "PCAP"
  identifier = "pcap"
  parent = "python_certification"
  url = "/python_certification/pcap/" # Direkte Ziel-URL
  weight = 20

# Untermenüpunkt: Functional Programming
[[main]]
  name = "Functional Programming"
  identifier = "functional-programming"
  parent = "bootdev"
  url = "/bootdev/functional-programming/" # Direkte Ziel-URL
  weight = 20

# Untermenüpunkt:Recursion
[[main]]
  name = "Recursion"
  identifier = "recursion"
  parent = "functional-programming"
  url = "/bootdev/functional-programming/recursion" # Direkte Ziel-URL
  weight = 20



